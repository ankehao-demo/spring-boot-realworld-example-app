<div class="max-w-md mx-auto mt-8">
  <div class="text-center mb-8">
    <h1 class="text-3xl font-bold text-gray-900">Sign in</h1>
    <a routerLink="/register" class="text-green-500 hover:underline">Need an account?</a>
  </div>

  @if (error) {
    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">{{ error }}</div>
  }

  <form (ngSubmit)="onSubmit()" class="space-y-4">
    <input
      type="email"
      [(ngModel)]="email"
      name="email"
      placeholder="Email"
      required
      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500" />
    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      placeholder="Password"
      required
      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500" />
    <button
      type="submit"
      [disabled]="isLoading"
      class="w-full bg-green-500 text-white py-3 rounded-lg hover:bg-green-600 disabled:opacity-50 disabled:cursor-not-allowed">
      {{ isLoading ? 'Signing in...' : 'Sign in' }}
    </button>
  </form>
</div>
