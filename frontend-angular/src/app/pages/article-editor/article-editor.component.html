<div class="max-w-4xl mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold text-gray-900 mb-8">{{ isEditing ? 'Edit Article' : 'New Article' }}</h1>

  @if (error) {
    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">{{ error }}</div>
  }

  <form (ngSubmit)="onSubmit()" class="space-y-6">
    <input
      type="text"
      [(ngModel)]="title"
      name="title"
      placeholder="Article Title"
      required
      class="w-full px-4 py-3 text-xl border border-gray-300 rounded-lg focus:outline-none focus:border-green-500" />
    <input
      type="text"
      [(ngModel)]="description"
      name="description"
      placeholder="What's this article about?"
      required
      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500" />
    <textarea
      [(ngModel)]="body"
      name="body"
      placeholder="Write your article (in markdown)"
      required
      rows="8"
      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500 resize-y">
    </textarea>

    <div>
      <input
        type="text"
        [(ngModel)]="tagInput"
        name="tagInput"
        placeholder="Enter tags (press Enter to add)"
        (keydown)="onTagKeyPress($event)"
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500" />
      @if (tagList.length > 0) {
        <div class="flex flex-wrap gap-2 mt-2">
          @for (tag of tagList; track tag) {
            <span class="inline-flex items-center px-3 py-1 bg-gray-200 text-gray-700 rounded-full text-sm">
              {{ tag }}
              <button type="button" (click)="removeTag(tag)" class="ml-2 text-gray-500 hover:text-gray-700">&times;</button>
            </span>
          }
        </div>
      }
    </div>

    <div class="flex justify-end">
      <button
        type="submit"
        [disabled]="isLoading"
        class="px-6 py-3 bg-green-500 text-white rounded-lg hover:bg-green-600 disabled:opacity-50 disabled:cursor-not-allowed">
        {{ isLoading ? 'Publishing...' : 'Publish Article' }}
      </button>
    </div>
  </form>
</div>
