<div class="max-w-md mx-auto mt-8">
  <h1 class="text-3xl font-bold text-gray-900 text-center mb-8">Your Settings</h1>

  @if (error) {
    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">{{ error }}</div>
  }

  <form (ngSubmit)="onSubmit()" class="space-y-4">
    <input
      type="url"
      [(ngModel)]="image"
      name="image"
      placeholder="URL of profile picture"
      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500" />
    <input
      type="text"
      [(ngModel)]="username"
      name="username"
      placeholder="Username"
      required
      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500" />
    <textarea
      [(ngModel)]="bio"
      name="bio"
      placeholder="Short bio about you"
      rows="8"
      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500 resize-y">
    </textarea>
    <input
      type="email"
      [(ngModel)]="email"
      name="email"
      placeholder="Email"
      required
      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500" />
    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      placeholder="New Password"
      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500" />
    <button
      type="submit"
      [disabled]="isLoading"
      class="w-full bg-green-500 text-white py-3 rounded-lg hover:bg-green-600 disabled:opacity-50 disabled:cursor-not-allowed">
      {{ isLoading ? 'Updating...' : 'Update Settings' }}
    </button>
  </form>

  <hr class="my-8" />

  <button
    (click)="logout()"
    class="w-full bg-red-500 text-white py-3 rounded-lg hover:bg-red-600">
    Or click here to logout.
  </button>
</div>
