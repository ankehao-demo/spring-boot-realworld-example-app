@if (authService.currentUser; as user) {
  <form (ngSubmit)="onSubmit()" class="border border-gray-200 rounded">
    <textarea
      [(ngModel)]="body"
      name="body"
      placeholder="Write a comment..."
      class="w-full p-4 border-0 resize-none focus:outline-none"
      rows="3">
    </textarea>
    <div class="flex justify-between items-center px-4 py-3 bg-gray-50 border-t">
      <div class="flex items-center">
        <img [src]="user.image || defaultImage" [alt]="user.username" class="w-8 h-8 rounded-full mr-2" />
        <span class="text-sm text-gray-600">{{ user.username }}</span>
      </div>
      <button
        type="submit"
        [disabled]="!body.trim() || isSubmitting"
        class="px-4 py-2 bg-green-500 text-white rounded text-sm hover:bg-green-600 disabled:opacity-50 disabled:cursor-not-allowed">
        {{ isSubmitting ? 'Posting...' : 'Post Comment' }}
      </button>
    </div>
  </form>
}
