<nav class="bg-white shadow-sm border-b">
  <div class="max-w-6xl mx-auto px-4">
    <div class="flex justify-between items-center h-16">
      <a routerLink="/" class="text-2xl font-bold text-green-500">conduit</a>

      <div class="flex items-center space-x-4">
        <a routerLink="/" class="text-gray-600 hover:text-gray-900">Home</a>

        @if (authService.currentUser; as user) {
          <a routerLink="/editor" class="text-gray-600 hover:text-gray-900 flex items-center">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            New Article
          </a>
          <a routerLink="/settings" class="text-gray-600 hover:text-gray-900 flex items-center">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            Settings
          </a>
          <a [routerLink]="['/profile', user.username]" class="text-gray-600 hover:text-gray-900 flex items-center">
            @if (user.image) {
              <img [src]="user.image" [alt]="user.username" class="w-6 h-6 rounded-full mr-2" />
            }
            {{ user.username }}
          </a>
          <button (click)="logout()" class="text-gray-600 hover:text-gray-900">Logout</button>
        } @else {
          <a routerLink="/login" class="text-gray-600 hover:text-gray-900">Sign in</a>
          <a routerLink="/register" class="text-gray-600 hover:text-gray-900">Sign up</a>
        }
      </div>
    </div>
  </div>
</nav>
